/* ---------- Interaktion ---------- */
function updateTaskCalc() {
  const el = $("#taskCalc");
  if (!el) return;
  const diff = +$('#taskDiff .pt-chip[aria-pressed="true"]').dataset.val;
  const dur = +$('#taskDur .pt-chip[aria-pressed="true"]').dataset.val;
  const pts = Math.round(diff * dur);
  const who = $('#taskWho .pt-chip[aria-pressed="true"]').dataset.who;
  el.innerHTML = `= <strong>${pts} P</strong>` +
    (who ? ` &nbsp;·&nbsp; übernimmt's ${esc(displayName(otherOf(who)))}: <strong>${pts + bonusFor(pts)} P</strong> 🏅` : "");
}

function bindMain() {
  const main = $("#main");

  main.onclick = (e) => {
    const day = e.target.closest(".day-chip");
    if (day) {
      day.setAttribute("aria-pressed", String(day.getAttribute("aria-pressed") !== "true"));
      return;
    }
    const chip = e.target.closest(".pt-chip");
    if (chip) {
      if (chip.dataset.metric) { duelMetric = chip.dataset.metric; return render(); }
      chip.parentElement.querySelectorAll(".pt-chip").forEach((c) => c.setAttribute("aria-pressed", "false"));
      chip.setAttribute("aria-pressed", "true");
      if (chip.parentElement.id === "taskKind") {
        const dr = $("#daysRow");
        if (dr) dr.hidden = chip.dataset.kind === "once";
      }
      updateTaskCalc();
      return;
    }
    const who = e.target.closest(".who-pick");
    if (who) {
      device.me = who.dataset.who;
      save(); render();
      return;
    }
    const sug = e.target.closest(".sug-chip");
    if (sug) {
      const inp = $("#" + (sug.dataset.input || "taskTitle"));
      if (inp) inp.value = sug.dataset.suggest; // kein focus: iOS-Tastatur nicht ungefragt öffnen
      return;
    }
    const btn = e.target.closest("[data-act]");
    if (btn) {
      const act = btn.dataset.act;
      const li = btn.closest("[data-id]") || btn;
      const id = li.dataset.id;
      if (act === "check") return toggleComplete(id, e);
      if (act === "menu") { openMenuTask = openMenuTask === id ? null : id; return render(); }
      if (act === "rmenu") { openMenuReward = openMenuReward === id ? null : id; return render(); }
      if (act === "archive") return archiveTask(id);
      if (act === "archiveReward") return archiveReward(id);
      if (act === "edit") {
        editingTask = id; addingTask = false; openMenuTask = null;
        render();
        return;
      }
      if (act === "redeem") return redeem(id, e);
      if (act === "dismissInstall") { device.installHintDismissed = 1; save(); return render(); }
      if (act === "cheer") return confetti(e.clientX || innerWidth / 2, e.clientY || innerHeight / 2);
      if (act === "peek") return toast(btn.dataset.info);
      if (act === "spin") return spinWheel();
      if (act === "gowheel") return selectTab("duel");
      if (act === "skip") return toggleSkip(id);
      if (act === "roulette") return openRoulette();
      if (act === "blitz") return openBlitz();
      if (act === "pettap") return petSpeak(li);
      if (act === "petopen") return openPet();
    }
    if (e.target.id === "addTaskBtn") { quickAdd = true; addingTask = false; editingTask = null; pendingTitle = ""; render(); }
    if (e.target.id === "quickCancel") { quickAdd = false; pendingTitle = ""; render(); }
    if (e.target.id === "quickMore") { pendingTitle = ($("#quickTitle") || {}).value || ""; quickAdd = false; addingTask = true; editingTask = null; render(); }
    if (e.target.id === "cancelTask") { addingTask = false; editingTask = null; pendingTitle = ""; render(); }
    if (e.target.id === "addRewardBtn") { addingReward = true; render(); }
    if (e.target.id === "cancelReward") { addingReward = false; render(); }
    if (e.target.id === "qrToggle") { qrOpen = true; render(); }
    if (e.target.id === "shareBtn") shareSync(true);
    if (e.target.id === "copyBtn") shareSync(false);
    if (e.target.id === "codeCopyBtn") copySyncCode();
    if (e.target.id === "codeApplyBtn") applySyncCode();
    if (e.target.id === "autoSyncBtn") enableAutoSync();
    if (e.target.id === "notifBtn") askNotifications();
  };

  main.onchange = (e) => {
    if (e.target.id === "nameP1" || e.target.id === "nameP2") {
      const pid = e.target.id === "nameP1" ? "p1" : "p2";
      const val = e.target.value.trim();
      const p = playerById(pid);
      if (val && val !== p.name) { p.name = val; p.updatedAt = now(); save(); render(); }
    }
  };

  $("#quickForm")?.addEventListener("submit", (e) => {
    e.preventDefault();
    const title = $("#quickTitle").value.trim();
    if (!title) return toast("Gib der Aufgabe einen Namen");
    const id = uid();
    state.tasks.push({
      id, title, points: Math.round(QUICK_DEFAULTS.diff * QUICK_DEFAULTS.dur),
      assignee: QUICK_DEFAULTS.assignee, diff: QUICK_DEFAULTS.diff, dur: QUICK_DEFAULTS.dur,
      kind: QUICK_DEFAULTS.kind, days: null, room: QUICK_DEFAULTS.room,
      week: isoWeek(), createdAt: now(), archived: 0, updatedAt: now(),
    });
    quickAdd = false; pendingTitle = ""; save(); render();
    confirmSheet({
      title: "Gespeichert ✨",
      body: `„${esc(title)}“ ist als Einmal-Aufgabe für beide da. Dauer, Punkte oder Typ noch anpassen?`,
      confirmLabel: "Ja, anpassen ✏️",
      cancelLabel: "Später",
      onConfirm: () => { editingTask = id; render(); },
    });
  });

  $("#taskForm")?.addEventListener("submit", (e) => {
    e.preventDefault();
    const title = $("#taskTitle").value.trim();
    if (!title) return toast("Gib der Aufgabe einen Namen");
    const diff = +$('#taskDiff .pt-chip[aria-pressed="true"]').dataset.val;
    const dur = +$('#taskDur .pt-chip[aria-pressed="true"]').dataset.val;
    const assignee = $('#taskWho .pt-chip[aria-pressed="true"]').dataset.who || null;
    const kind = $('#taskKind .pt-chip[aria-pressed="true"]').dataset.kind;
    const room = $('#taskRoom .pt-chip[aria-pressed="true"]').dataset.room || null;
    let days = [...document.querySelectorAll('#taskDays .day-chip[aria-pressed="true"]')].map((b) => +b.dataset.day);
    if (kind === "once" || days.length === 0 || days.length === 7) days = null;
    const points = Math.round(diff * dur);
    if (editingTask) {
      const t = state.tasks.find((x) => x.id === editingTask);
      if (t) Object.assign(t, { title, points, assignee, diff, dur, kind, days, room, updatedAt: now() });
      editingTask = null; save(); render();
      return toast("Aufgabe aktualisiert ✏️");
    }
    if (kind !== "once") {
      const lanes = laneCounts();
      const full = (assignee ? [assignee] : ["p1", "p2"]).find((l) => lanes[l] >= WEEKLY_NEW_TASKS);
      if (full) return toast(`${displayName(full)} hat diese Woche schon ${WEEKLY_NEW_TASKS} neue Aufgaben – ab Montag wieder! (Einmal-Aufgaben gehen immer)`);
    }
    state.tasks.push({
      id: uid(), title, points, assignee, diff, dur, kind, days, room,
      week: isoWeek(), createdAt: now(), archived: 0, updatedAt: now(),
    });
    addingTask = false; save(); render();
    toast(kind === "once" ? "Einmal-Aufgabe angelegt ✨" : "Aufgabe angelegt ✨");
  });

  $("#rewardForm")?.addEventListener("submit", (e) => {
    e.preventDefault();
    const title = $("#rewardTitle").value.trim();
    if (!title) return toast("Gib der Belohnung einen Namen");
    const cost = +$('#rewardPoints .pt-chip[aria-pressed="true"]').dataset.pts;
    state.rewards.push({ id: uid(), title, cost, createdAt: now(), archived: 0, updatedAt: now() });
    addingReward = false; save(); render();
    toast("Belohnung angelegt 🎁");
  });

  if (tab === "tasks" && (addingTask || editingTask)) updateTaskCalc();
  if (tab === "tasks" && allDoneToday() && device.celebratedDay !== dayKey()) {
    device.celebratedDay = dayKey(); save();
    confetti(innerWidth / 2, innerHeight / 3, { glyphs: ["🎉", "🫧", "✨", "🧹"], n: 36 });
  }
  if (tab === "profile" && qrOpen) renderQr();
  if (tab === "duel") {
    const wc = $("#wheelCanvas");
    if (wc) {
      drawWheel(wc);
      const spun = myWheelSpinToday();
      if (spun) {
        let angle = spun.wheelAngle;
        if (angle == null) {
          let cum = 0;
          for (const s of WHEEL_SEGS) { if (s.v === spun.points) { angle = cum + s.deg / 2; break; } cum += s.deg; }
        }
        if (angle != null) wc.style.transform = `rotate(${360 - angle}deg)`;
      }
    }
    requestAnimationFrame(() => {
      document.querySelectorAll(".bar-fill, .lvl-fill").forEach((b) => { b.style.width = b.dataset.w + "%"; });
      document.querySelectorAll(".col-fill").forEach((b) => { b.style.height = b.dataset.h + "%"; });
      document.querySelectorAll("[data-count]").forEach((el) => countUp(el, +el.dataset.count));
    });
  }
}

function countUp(el, target) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = target + " P"; return; }
  const t0 = performance.now(), dur = 700;
  const tick = (t) => {
    const k = Math.min(1, (t - t0) / dur);
    el.textContent = Math.round(target * (1 - Math.pow(1 - k, 3))) + " P";
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

async function renderQr() {
  if (!$("#qrCanvas")) return;
  const url = await buildSyncUrl();
  const canvas = $("#qrCanvas"), note = $("#qrNote");
  if (!canvas) return; // Tab inzwischen gewechselt
  if (drawQR(canvas, url)) {
    note.textContent = "Mit der Kamera-App scannen – öffnet Klarschiff mit eurem kompletten Stand.";
  } else {
    canvas.closest(".qr-wrap").remove();
    note.textContent = "Euer Verlauf ist inzwischen zu groß für einen QR-Code – nutzt einfach den Sync-Code oder Sync-Link darunter, die können beliebig viel.";
  }
}

async function importFromText(raw) {
  const payload = raw.includes("#sync=") ? raw.split("#sync=")[1] : raw;
  try {
    mergeState(await decodeSync(payload.trim()));
    device.lastImportAt = now();
    if (device.notifiedUpTo == null) device.notifiedUpTo = now(); // Beitritt: alte Historie nicht nachmelden
    save();
    notifyPartnerNews();
    return true;
  } catch { return false; }
}

async function copySyncCode() {
  const code = await encodeSync();
  try { await navigator.clipboard.writeText(code); toast("Sync-Code kopiert 📋"); }
  catch { prompt("Code kopieren:", code); }
  device.lastShareAt = now();
  save();
  if (tab === "profile") render();
}

async function applySyncCode() {
  const raw = $("#codeInput").value.trim();
  if (!raw) return toast("Füg zuerst einen Code ein");
  if (await importFromText(raw)) {
    render();
    toast("Code übernommen – ihr seid synchron ✨");
  } else {
    toast("Dieser Code konnte nicht gelesen werden");
  }
}

async function shareSync(useShareSheet) {
  const url = await buildSyncUrl();
  if (useShareSheet && navigator.share) {
    try { await navigator.share({ title: "Klarschiff – unser Stand", url }); } catch { return; /* abgebrochen */ }
  } else {
    try { await navigator.clipboard.writeText(url); toast("Link kopiert 📋"); }
    catch { prompt("Link kopieren:", url); }
  }
  device.lastShareAt = now();
  save();
  if (tab === "profile") render();
}

function toggleComplete(taskId, e) {
  if (!device.me) return openSetup();
  const task = state.tasks.find((t) => t.id === taskId);
  if (!task) return;
  const done = todaysCompletion(taskId);
  if (done) {
    if (done.playerId !== device.me) return toast(`Das hat ${displayName(done.playerId)} schon erledigt`);
    done.deleted = now(); done.updatedAt = now();
    save(); render();
    return toast("Zurückgenommen");
  }
  // Vorschau für die Bestätigung (Crit bleibt Überraschung)
  const pBonus = task.assignee && task.assignee !== device.me ? bonusFor(task.points) : 0;
  const pSpot = spotlightTaskId() === task.id ? SPOT_BONUS : 0;
  const preview = task.points + pBonus + pSpot;
  const cx = e.clientX || innerWidth / 2, cy = e.clientY || innerHeight / 3;
  confirmSheet({
    title: `„${esc(task.title)}“ erledigt?`,
    body: `Das gibt dir <strong>+${preview} P</strong>${pBonus ? " – inkl. Bonus, weil's nicht dein Job war 🏅" : ""}${pSpot ? " – inkl. ✨ Rampenlicht" : ""}.`,
    confirmLabel: "Ja, erledigt! ✅",
    onConfirm: () => performComplete(task, cx, cy),
  });
}

function performComplete(task, cx, cy, blitzBonus = 0) {
  let points = task.points, bonus = 0, spot = 0, crit = 0, blitz = 0;
  if (task.assignee && task.assignee !== device.me) {
    bonus = bonusFor(task.points);
    points += bonus;
  }
  if (spotlightTaskId() === task.id) { spot = SPOT_BONUS; points += spot; }
  if (blitzBonus > 0) { blitz = blitzBonus; points += blitz; }
  if (Math.random() < critChance()) { crit = 1; points *= 2; }
  const lvlBefore = levelInfo(earnedTotal(device.me)).lvl;
  state.completions.push({
    id: uid(), taskId: task.id, title: task.title, points, bonus, spot, crit, blitz,
    playerId: device.me, day: dayKey(), ts: now(), deleted: 0, updatedAt: now(),
  });
  const mySkip = skipOf(task.id, device.me); // „doch noch geschafft“ hebt das ✕ auf
  if (mySkip) { mySkip.deleted = now(); mySkip.updatedAt = now(); }
  if (task.kind === "once") { task.archived = now(); task.updatedAt = now(); }
  const stageBefore = petStage().i;
  petReactUntil = now() + 2600; // Haustier jubelt kurz mit
  save(); render();
  setTimeout(() => { if (tab === "tasks" && !document.querySelector(".overlay")) render(); }, 2700); // Jubel wieder beenden
  if (petStage().i > stageBefore) {
    setTimeout(() => { toast(`${state.pet.name || "Euer Haustier"} ist zu „${petStage().name}“ herangewachsen! 🎉`); confetti(innerWidth / 2, innerHeight / 3, { glyphs: ["🐣", "🌱", "✨", "🎉"], n: 40 }); }, 900);
  }
  confetti(cx, cy, crit ? { glyphs: ["💥", "⭐️", "✨"], n: 34 } : {});
  toast(crit
    ? `💥 KRITISCHER TREFFER! Alles doppelt: +${points} P`
    : blitz
      ? `⚡️ Durchgezogen! +${points} P (inkl. ${blitz} P Blitz-Bonus)`
      : task.kind === "once"
        ? `Einmal-Aufgabe erledigt und abgehakt ✅ +${points} P${bonus ? ` (mit ${bonus} P Bonus 🏅)` : ""}`
        : bonus
          ? `+${points} P – davon ${bonus} P Bonus, weil's eigentlich nicht dein Job war! 🏅`
          : spot
            ? `✨ Rampenlicht-Aufgabe: +${points} P (inkl. ${spot} extra)!`
            : `+${points} P für dich! 🎉`);
  const after = levelInfo(earnedTotal(device.me));
  if (after.lvl > lvlBefore) {
    setTimeout(() => {
      toast(`🎖 LEVEL UP! Du bist jetzt Lv. ${after.lvl} „${after.title}“`);
      confetti(innerWidth / 2, innerHeight / 3, { glyphs: ["🎖", "🧹", "✨", "🫧"], n: 40 });
    }, 1800);
  }
}

function confirmSheet({ title, body, confirmLabel, cancelLabel, onConfirm }) {
  if (document.querySelector(".overlay")) return;
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true">
      <h2>${title}</h2>
      ${body ? `<p class="hint">${body}</p>` : ""}
      <button class="primary-btn" id="cfYes">${confirmLabel}</button>
      <button class="sub-btn" id="cfNo">${cancelLabel || "Abbrechen"}</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e) => {
    if (e.target.id === "cfYes") { overlay.remove(); onConfirm(); }
    else if (e.target.id === "cfNo" || e.target === overlay) overlay.remove();
  });
}

function toggleSkip(taskId) {
  if (!device.me) return openSetup();
  const ex = skipOf(taskId, device.me);
  if (ex) {
    ex.deleted = now(); ex.updatedAt = now();
    toast("Wieder offen – du schaffst das 💪");
  } else {
    if (todaysCompletion(taskId)) { openMenuTask = null; return toast("Ist ja schon erledigt 🎉"); }
    state.skips.push({ id: uid(), taskId, playerId: device.me, day: dayKey(), ts: now(), deleted: 0, updatedAt: now() });
    toast("Okay, heute nicht – morgen ist auch ein Tag 💚");
  }
  openMenuTask = null; save(); render();
}

function archiveReward(rewardId) {
  const r = state.rewards.find((x) => x.id === rewardId);
  if (r) { r.archived = now(); r.updatedAt = now(); }
  openMenuReward = null; save(); render();
  toast("Belohnung entfernt");
}

function archiveTask(taskId) {
  const t = state.tasks.find((x) => x.id === taskId);
  if (t) { t.archived = now(); t.updatedAt = now(); }
  openMenuTask = null; save(); render();
  toast("Aufgabe entfernt");
}

function redeem(rewardId, e) {
  if (!device.me) return openSetup();
  const r = state.rewards.find((x) => x.id === rewardId);
  if (!r || balance(device.me) < r.cost) return;
  const cx = e.clientX || innerWidth / 2, cy = e.clientY || innerHeight / 3;
  confirmSheet({
    title: `„${esc(r.title)}“ einlösen?`,
    body: `Dafür gehen <strong>${r.cost} P</strong> von deinem Konto (aktuell ${balance(device.me)} P).`,
    confirmLabel: "Einlösen 🎁",
    onConfirm: () => {
      state.redemptions.push({ id: uid(), rewardId, title: r.title, cost: r.cost, playerId: device.me, ts: now(), deleted: 0, updatedAt: now() });
      save(); render();
      confetti(cx, cy);
      toast(`„${r.title}“ eingelöst – gönn's dir! 🎉`);
    },
  });
}

  t.addEventListener("click", () => selectTab(t.dataset.tab));
});
$("#profileShortcut").addEventListener("click", () => selectTab("profile"));

/* ---------- Ersteinrichtung ---------- */
function openSetup() {
  if (document.querySelector(".overlay")) return;
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true">
      <h2>Willkommen bei Klarschiff! 🧹</h2>
      <p class="hint">Kurz einrichten: Wie heißt ihr zwei, und wessen Handy ist das hier?</p>
      <span class="form-label">Eure Namen</span>
      <input id="setupP1" placeholder="Name Spieler 1" maxlength="20" value="${esc(playerById("p1").name)}" autocomplete="off">
      <input id="setupP2" placeholder="Name Spieler 2" maxlength="20" value="${esc(playerById("p2").name)}" autocomplete="off">
      <span class="form-label">Dieses Handy gehört …</span>
      <div class="who-row">
        <button class="who-pick" data-who="p1" aria-pressed="${device.me === "p1"}">${esc(displayName("p1"))}</button>
        <button class="who-pick" data-who="p2" aria-pressed="${device.me === "p2"}">${esc(displayName("p2"))}</button>
      </div>
      <button class="primary-btn" id="setupGo">Los geht's!</button>
      <button class="sub-btn" id="setupCodeToggle">Ich habe schon einen Sync-Code oder QR-Link</button>
      <div id="setupCodeRow" hidden>
        <input id="setupCodeInput" placeholder="Code oder Link einfügen …" autocomplete="off">
        <button class="primary-btn" id="setupCodeApply" style="margin-top:10px">Code übernehmen</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  overlay.addEventListener("click", async (e) => {
    const who = e.target.closest(".who-pick");
    if (who) {
      device.me = who.dataset.who;
      overlay.querySelectorAll(".who-pick").forEach((b) => b.setAttribute("aria-pressed", String(b === who)));
      return;
    }
    if (e.target.id === "setupCodeToggle") {
      overlay.querySelector("#setupCodeRow").hidden = false; // kein focus: Tastatur erst beim Antippen
      return;
    }
    if (e.target.id === "setupCodeApply") {
      const raw = overlay.querySelector("#setupCodeInput").value.trim();
      if (!raw) return toast("Füg zuerst den Code ein");
      if (await importFromText(raw)) {
        overlay.remove(); render();
        toast("Stand übernommen – sag nur noch, wer du bist ✨");
        openSetup(); // Namen sind jetzt vorausgefüllt, nur noch „wer bin ich“ wählen
      } else {
        toast("Dieser Code konnte nicht gelesen werden");
      }
      return;
    }
    if (e.target.id === "setupGo") {
      for (const [inputId, pid] of [["#setupP1", "p1"], ["#setupP2", "p2"]]) {
        const val = overlay.querySelector(inputId).value.trim();
        const p = playerById(pid);
        if (val && val !== p.name) { p.name = val; p.updatedAt = now(); }
      }
      if (state.players.some((p) => !p.name)) return toast("Tragt noch eure Namen ein");
      if (!device.me) return toast("Sag noch kurz, wessen Handy das ist");
      overlay.remove(); save(); render();
    }
  });
}

/* ---------- Start: Sync-Import & Erstlauf ---------- */
async function boot() {
  const m = location.hash.match(/#sync=(.+)/);
  if (m) {
    try {
      const incoming = await decodeSync(m[1]);
      mergeState(incoming);
      device.lastImportAt = now();
      save();
      toast("Stand übernommen – ihr seid synchron ✨");
    } catch { toast("Der Sync-Link konnte nicht gelesen werden"); }
    try { history.replaceState(null, "", location.pathname + location.search); } catch { /* sandboxed */ }
  }
  render();
  if (!device.me || state.players.some((p) => !p.name)) openSetup();
  if (device.notifiedUpTo == null) { device.notifiedUpTo = now(); save(); }
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register("./sw.js").catch(() => { /* z. B. Artifact-Hosting */ });
  }
  autoSyncTick();
  setInterval(autoSyncTick, SYNC_INTERVAL);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") autoSyncTick();
  });
}
boot();
})();
</script>
