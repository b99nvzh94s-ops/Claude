<title>Klarschiff – Aufräum-Spiel für uns zwei</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131A17" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">

<style>
  :root {
    --paper: #F2F5F1;
    --card: #FFFFFF;
    --card-2: #E9EFE9;
    --ink: #1F2D26;
    --muted: #66756D;
    --line: #DCE4DD;
    --spruce: #1F6F54;
    --spruce-ink: #FFFFFF;
    --spruce-soft: #DDEDE5;
    --coin: #B97A14;
    --coin-soft: #F6E7C8;
    --danger: #B3402F;
    --shadow: 0 1px 2px rgba(31,45,38,.06), 0 6px 20px rgba(31,45,38,.07);
    --display: ui-rounded, -apple-system, "SF Pro Rounded", system-ui, sans-serif;
    --body: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    --p1c: #0FA38A; --p1c-2: #0B8A74; --p1-soft: rgba(15, 163, 138, .16);
    --p2c: #A855F7; --p2c-2: #8E3DE0; --p2-soft: rgba(168, 85, 247, .16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #131A17;
      --card: #1C2520;
      --card-2: #232E28;
      --ink: #E9EFEA;
      --muted: #93A29A;
      --line: #2C3831;
      --spruce: #3FB98A;
      --spruce-ink: #0E1F19;
      --spruce-soft: #1E332B;
      --coin: #E9B45C;
      --coin-soft: #35301F;
      --danger: #E5715C;
      --shadow: 0 1px 2px rgba(0,0,0,.25), 0 6px 20px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --paper: #131A17;
    --card: #1C2520;
    --card-2: #232E28;
    --ink: #E9EFEA;
    --muted: #93A29A;
    --line: #2C3831;
    --spruce: #3FB98A;
    --spruce-ink: #0E1F19;
    --spruce-soft: #1E332B;
    --coin: #E9B45C;
    --coin-soft: #35301F;
    --danger: #E5715C;
    --shadow: 0 1px 2px rgba(0,0,0,.25), 0 6px 20px rgba(0,0,0,.3);
  }
  :root[data-theme="light"] {
    --paper: #F2F5F1;
    --card: #FFFFFF;
    --card-2: #E9EFE9;
    --ink: #1F2D26;
    --muted: #66756D;
    --line: #DCE4DD;
    --spruce: #1F6F54;
    --spruce-ink: #FFFFFF;
    --spruce-soft: #DDEDE5;
    --coin: #B97A14;
    --coin-soft: #F6E7C8;
    --danger: #B3402F;
    --shadow: 0 1px 2px rgba(31,45,38,.06), 0 6px 20px rgba(31,45,38,.07);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--body);
    font-size: 16px;
    background:
      radial-gradient(70vw 45vh at 112% -8%, var(--p2-soft), transparent 70%),
      radial-gradient(70vw 45vh at -12% 108%, var(--p1-soft), transparent 70%),
      var(--paper);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    touch-action: manipulation;
    overscroll-behavior-y: none;
  }
  button {
    font: inherit; color: inherit; background: none; border: 0; cursor: pointer;
    -webkit-user-select: none; user-select: none;
  }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--spruce); outline-offset: 2px; }
  input {
    font: inherit; font-size: 16px; /* <16px löst iOS-Autozoom beim Fokussieren aus */
    color: var(--ink); background: var(--card-2);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; width: 100%; appearance: none; -webkit-appearance: none;
  }
  input::placeholder { color: var(--muted); }

  #app {
    max-width: 560px; margin: 0 auto; min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }

  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px 6px;
  }
  .brand { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -.01em; }
  .brand .broom { font-size: 17px; margin-right: 4px; }
  .top-right { display: flex; gap: 8px; align-items: center; }
  .chip {
    font-size: 12px; font-weight: 600; color: var(--muted);
    background: var(--card-2); border: 1px solid var(--line);
    padding: 5px 10px; border-radius: 999px;
  }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px; font-size: 18px;
    background: var(--card-2); border: 1px solid var(--line);
    display: grid; place-items: center;
  }

  .scoreboard {
    margin: 8px 18px 4px; background: var(--card); border-radius: 20px;
    box-shadow: var(--shadow); display: flex; overflow: hidden;
  }
  .score {
    flex: 1; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 2px;
  }
  .score + .score { border-left: 1px solid var(--line); }
  .score .who { font-size: 13px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .score .who .me-tag {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    background: var(--spruce-soft); color: var(--spruce); padding: 2px 6px; border-radius: 6px;
  }
  .score .pts {
    font-family: var(--display); font-variant-numeric: tabular-nums;
    font-size: 34px; font-weight: 800; line-height: 1.1; color: var(--coin);
  }
  .score .streak { font-size: 11.5px; color: var(--muted); white-space: nowrap; }

  main { flex: 1; padding: 10px 18px 16px; display: flex; flex-direction: column; gap: 12px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .section-head h2 { font-family: var(--display); font-size: 17px; font-weight: 800; }
  .hint { font-size: 13px; color: var(--muted); line-height: 1.45; }

  .budget {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
    padding: 12px 14px;
  }
  .budget .dots { display: flex; gap: 6px; }
  .budget .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--card-2); border: 1.5px solid var(--line); }
  .budget .dot.used { background: var(--spruce); border-color: var(--spruce); }
  .budget span { font-size: 13px; color: var(--muted); }
  .budget strong { color: var(--ink); }

  .add-btn {
    background: linear-gradient(135deg, var(--spruce), var(--p1c)); color: var(--spruce-ink);
    font-family: var(--display); font-weight: 700; font-size: 15px;
    border-radius: 999px; padding: 9px 16px; min-height: 40px;
    box-shadow: 0 4px 14px var(--p1-soft);
  }
  .add-btn[disabled] { opacity: .45; cursor: default; }

  .form-card {
    background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
    padding: 14px; display: flex; flex-direction: column; gap: 12px;
  }
  .form-label {
    font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted);
  }
  .point-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .pt-chip {
    font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums;
    border: 1.5px solid var(--line); background: var(--card-2);
    border-radius: 999px; padding: 8px 14px; min-height: 40px; font-size: 15px;
  }
  .pt-chip[aria-pressed="true"] { background: var(--coin-soft); border-color: var(--coin); color: var(--coin); }
  .tab { position: relative; }
  .tab-badge {
    position: absolute; top: 5px; right: calc(50% - 27px);
    background: var(--danger); color: #fff; font-size: 10px; font-weight: 700;
    border-radius: 999px; min-width: 16px; height: 16px;
    display: grid; place-items: center; padding: 0 4px;
  }
  .feed-day {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); padding: 12px 4px 4px !important; border-bottom: 0 !important;
  }
  .rp { height: 6px; background: var(--card-2); border-radius: 999px; margin-top: 7px; overflow: hidden; }
  .rp-fill { height: 100%; background: linear-gradient(90deg, var(--coin), #E9B45C); border-radius: 999px; }
  .alldone {
    text-align: center; font-family: var(--display); font-weight: 700; font-size: 15px;
    background: linear-gradient(135deg, var(--spruce-soft), var(--coin-soft));
    border-radius: 16px; padding: 16px;
  }
  .task.spotlite { box-shadow: var(--shadow), 0 0 0 2px var(--coin); }
  .lvl-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .lvl-name { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; }
  .lvl-title { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .lvl-track { height: 8px; background: var(--card-2); border-radius: 999px; overflow: hidden; margin: 6px 0 10px; }
  .lvl-fill { height: 100%; border-radius: 999px; transition: width .7s cubic-bezier(.22, 1, .36, 1); }
  .lvl-fill.p1 { background: linear-gradient(90deg, var(--p1c-2), var(--p1c)); }
  .lvl-fill.p2 { background: linear-gradient(90deg, var(--p2c-2), var(--p2c)); }
  .badge-owner { font-weight: 700; font-size: 13px; margin: 6px 0 6px; display: flex; align-items: center; gap: 7px; }
  .badge-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge {
    width: 42px; height: 42px; border-radius: 50%; font-size: 20px;
    background: var(--card-2); border: 1px solid var(--line);
    display: grid; place-items: center;
  }
  .badge.locked { filter: grayscale(1); opacity: .32; }
  .wheel-wrap { position: relative; display: grid; place-items: center; padding: 10px 0 4px; }
  .wheel-wrap canvas { width: min(72vw, 280px); height: auto; }
  .wheel-wrap.idle canvas { filter: grayscale(.65) opacity(.55); }
  .wheel-pointer {
    position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent;
    border-top: 16px solid var(--ink); z-index: 2;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.25));
  }
  .spin-btn {
    background: linear-gradient(135deg, var(--coin), #E9B45C); color: #3A2A05;
    font-family: var(--display); font-weight: 800; font-size: 16px;
    border-radius: 999px; padding: 13px 26px; min-height: 50px;
    box-shadow: 0 4px 14px rgba(233, 180, 92, .45);
  }
  .spin-btn[disabled] { opacity: .5; }
  .pergrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .percol { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .per-head { display: flex; align-items: center; gap: 7px; font-family: var(--display); font-weight: 800; font-size: 15px; padding-bottom: 2px; }
  .per-head.shared { margin-top: 12px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding-bottom: 0; }
  .shared-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .col-task {
    display: flex; align-items: center; gap: 7px; text-align: left;
    background: var(--card-2); border: 1px solid var(--line); border-radius: 12px;
    padding: 9px 10px; min-height: 44px; font-size: 13px;
  }
  .col-task .ct-status {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center; background: var(--card); color: var(--line); font-size: 12px;
  }
  .col-task.done-p1 .ct-status { background: var(--p1c); color: #fff; }
  .col-task.done-p2 .ct-status { background: var(--p2c); color: #fff; }
  .col-task.done .ct-title { text-decoration: line-through; color: var(--muted); }
  .col-task.skipped .ct-status { background: transparent; color: var(--danger); font-size: 15px; }
  .ct-title { flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.25; font-weight: 600; }
  .ct-pts { flex: none; font-family: var(--display); font-weight: 700; font-size: 11px; color: var(--coin); font-variant-numeric: tabular-nums; }
  .sh-row { display: flex; gap: 10px; }
  .sh-row .add-btn { flex: 1; }
  .blitz-ring {
    width: 190px; height: 190px; border-radius: 50%; margin: 8px auto;
    display: grid; place-items: center;
    background: conic-gradient(var(--coin) 0%, var(--card-2) 0);
  }
  .blitz-inner { width: 156px; height: 156px; border-radius: 50%; background: var(--card); display: grid; place-items: center; }
  #blitzTime { font-family: var(--display); font-weight: 800; font-size: 40px; font-variant-numeric: tabular-nums; }
  .rou-title {
    font-family: var(--display); font-weight: 800; font-size: 19px; text-align: center;
    min-height: 60px; display: grid; place-items: center; padding: 10px 14px;
    background: var(--card-2); border-radius: 14px; line-height: 1.3;
  }
  .empty-mini {
    font-size: 12px; color: var(--muted); border: 1px dashed var(--line);
    border-radius: 12px; padding: 10px; text-align: center;
  }

  .pet-card {
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(135deg, var(--spruce-soft), var(--card));
    border-radius: 18px; box-shadow: var(--shadow); padding: 12px 8px 12px 14px; position: relative;
  }
  .pet-stage { flex: none; position: relative; }
  .pet-avatar { position: relative; width: 66px; height: 62px; display: grid; place-items: center; cursor: pointer; }
  .pet-emoji { font-size: 46px; line-height: 1; display: block; transform-origin: center bottom; }
  .pet-hat { position: absolute; top: -5px; left: 50%; transform: translateX(-50%); font-size: 25px; z-index: 2; pointer-events: none; }
  .pet-zzz { position: absolute; top: -2px; right: -2px; font-size: 16px; animation: petzzz 2.4s ease-in-out infinite; }
  .mood-happy .pet-emoji { animation: petbob 1.3s ease-in-out infinite; }
  .mood-party .pet-emoji { animation: petdance .6s ease-in-out infinite; }
  .mood-content .pet-emoji { animation: petsway 3s ease-in-out infinite; }
  .mood-sleepy .pet-emoji { animation: petbreathe 3.6s ease-in-out infinite; filter: saturate(.75); }
  .mood-celebrate .pet-emoji { animation: petjump .5s ease-in-out infinite; }
  .pet-avatar.hop .pet-emoji { animation: petjump .45s ease; }
  @keyframes petbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes petdance { 0%,100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
  @keyframes petsway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  @keyframes petbreathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes petjump { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-13px); } }
  @keyframes petzzz { 0% { opacity: .3; transform: translateY(2px); } 50% { opacity: 1; } 100% { opacity: .3; transform: translateY(-5px); } }
  .pet-info { flex: 1; min-width: 0; }
  .pet-name { font-family: var(--display); font-weight: 800; font-size: 15px; }
  .pet-stagelabel { color: var(--muted); font-weight: 600; font-size: 13px; }
  .pet-mood { font-size: 12px; color: var(--muted); margin: 1px 0 6px; }
  .pet-next { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .pet-bubble {
    position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, 4px);
    background: var(--ink); color: var(--paper); font-size: 12px; font-weight: 600;
    padding: 7px 11px; border-radius: 12px; max-width: 58vw; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 5;
  }
  .pet-bubble.show { opacity: 1; transform: translate(-50%, -2px); }
  .pet-styles { display: flex; flex-wrap: wrap; gap: 8px; }
  .pet-style {
    border: 1.5px solid var(--line); background: var(--card-2); border-radius: 12px;
    padding: 8px 12px; min-height: 44px; font-weight: 600; font-size: 14px;
    display: flex; align-items: center; gap: 6px;
  }
  .pet-style[aria-pressed="true"] { border-color: var(--spruce); background: var(--spruce-soft); color: var(--spruce); }
  .pet-style.locked { opacity: .45; }
  .pet-style .lock-hint { font-size: 11px; color: var(--muted); font-weight: 500; }
  .day-chip {
    font-family: var(--display); font-weight: 700; font-size: 13px;
    width: 40px; min-height: 38px; border: 1.5px solid var(--line);
    background: var(--card-2); border-radius: 10px;
  }
  .day-chip[aria-pressed="true"] { background: var(--spruce-soft); border-color: var(--spruce); color: var(--spruce); }
  .task.notdue { opacity: .6; }
  .sug-chip {
    font-size: 13px; border: 1px dashed var(--line); background: transparent;
    color: var(--muted); border-radius: 999px; padding: 7px 12px; min-height: 36px;
  }
  .install-hint {
    display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted);
    background: var(--spruce-soft); border-radius: 14px; padding: 10px 6px 10px 14px; line-height: 1.4;
  }
  .install-hint strong { color: var(--spruce); }
  .install-hint .hint-x { flex: none; width: 36px; height: 36px; color: var(--muted); font-size: 14px; }
  .calc { font-size: 14px; color: var(--muted); }
  .calc strong { font-family: var(--display); color: var(--coin); font-variant-numeric: tabular-nums; }
  .form-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .ghost-btn { color: var(--muted); font-weight: 600; padding: 9px 12px; min-height: 40px; }

  ul.cards { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .task {
    background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
    padding: 12px 14px; display: flex; align-items: center; gap: 12px;
  }
  .check {
    width: 44px; height: 44px; flex: none; border-radius: 50%;
    border: 2px solid var(--line); display: grid; place-items: center;
    font-size: 20px; color: transparent; transition: transform .12s ease;
  }
  .task.done .check {
    background: linear-gradient(135deg, var(--spruce), var(--p1c));
    border-color: transparent; color: var(--spruce-ink);
    animation: pop .35s cubic-bezier(.22, 1.61, .36, 1);
  }
  @keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .check:active { transform: scale(.9); }
  .task-body { flex: 1; min-width: 0; }
  .task-title { font-weight: 600; font-size: 15px; }
  .task.done .task-title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
  .task-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .pts-badge {
    flex: none; font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums;
    font-size: 13px; color: var(--coin); background: var(--coin-soft);
    border-radius: 999px; padding: 4px 10px;
  }
  .more-btn { flex: none; width: 36px; height: 44px; color: var(--muted); font-size: 18px; }
  .task-menu { display: flex; justify-content: flex-end; }
  .danger-btn { color: var(--danger); font-weight: 600; font-size: 13px; padding: 8px 12px; min-height: 40px; }

  .reward { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 14px; }
  .reward-emoji { font-size: 24px; flex: none; width: 40px; text-align: center; }
  .reward-body { flex: 1; min-width: 0; }
  .reward-title { font-weight: 600; font-size: 15px; }
  .reward-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .redeem-btn {
    flex: none; font-family: var(--display); font-weight: 700; font-size: 14px;
    background: var(--coin-soft); color: var(--coin); border-radius: 999px;
    padding: 9px 14px; min-height: 40px; font-variant-numeric: tabular-nums;
  }
  .redeem-btn[disabled] { opacity: .5; cursor: default; }

  .feed { list-style: none; display: flex; flex-direction: column; }
  .feed li { display: flex; gap: 12px; align-items: baseline; padding: 10px 4px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .feed li:last-child { border-bottom: 0; }
  .feed .f-ico { flex: none; }
  .feed .f-text { flex: 1; line-height: 1.4; }
  .feed .f-text strong { font-weight: 650; }
  .feed .f-time { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .feed .f-pts { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--coin); }
  .feed .f-pts.neg { color: var(--danger); }

  .empty {
    text-align: center; color: var(--muted); font-size: 14px; line-height: 1.5;
    background: var(--card-2); border: 1px dashed var(--line); border-radius: 16px; padding: 22px 18px;
  }

  .qr-wrap { display: grid; place-items: center; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .qr-wrap canvas { width: min(100%, 260px); height: auto; image-rendering: pixelated; }

  nav.tabbar {
    position: sticky; bottom: 0; display: flex;
    background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;

<script>
(() => {
"use strict";

/* ---------- Persistenz ---------- */
const KLARSCHIFF_BUILD = "__KLARSCHIFF_BUILD__"; // wird beim Pages-Deploy ersetzt
const LS_STATE = "klarschiff.state.v1";
const LS_DEVICE = "klarschiff.device.v1";
const now = () => Date.now();
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(now()) + Math.random().toString(36).slice(2));

function freshState() {
  return {
    v: 1,
    players: [
      { id: "p1", name: "", updatedAt: 0 },
      { id: "p2", name: "", updatedAt: 0 },
    ],
    tasks: [],        // {id,title,points,assignee,kind,days,week,createdAt,archived,updatedAt}
    completions: [],  // {id,taskId,title,points,bonus,spot,crit,wheel,playerId,day,ts,deleted,updatedAt}
    rewards: [],      // {id,title,cost,createdAt,archived,updatedAt}
    redemptions: [],  // {id,rewardId,title,cost,playerId,ts,deleted,updatedAt}
    skips: [],        // {id,taskId,playerId,day,ts,deleted,updatedAt} – „heute nicht geschafft“
    pet: { name: "Fussel", style: "none", createdAt: now(), updatedAt: 0 }, // gemeinsames Haustier (updatedAt 0: Standard verliert gegen echte Änderung)
  };
}
let state = load(LS_STATE) || freshState();
state.skips = state.skips || []; // Migration älterer Stände
state.pet = state.pet || { name: "Fussel", style: "none", createdAt: now(), updatedAt: 0 };
let device = load(LS_DEVICE) || { me: null };

function load(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
}
function save() {
  localStorage.setItem(LS_STATE, JSON.stringify(state));
  localStorage.setItem(LS_DEVICE, JSON.stringify(device));
  syncSoon(); // bei aktivem Auto-Sync Änderungen zeitnah hochschieben
}

/* ---------- Zeit & Wochen ---------- */
function isoWeek(d = new Date()) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
  const week = 1 + Math.round(((date - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
  return `${date.getUTCFullYear()}-W${String(week).padStart(2, "0")}`;
}
const dayKey = (d = new Date()) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

function fmtTime(ts) {
  const d = new Date(ts), today = dayKey(), k = dayKey(d);
  const hm = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  if (k === today) return `heute ${hm}`;
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (k === dayKey(y)) return `gestern ${hm}`;
  return `${d.getDate()}.${d.getMonth() + 1}.`;
}

/* ---------- Abgeleitete Daten ---------- */
const WEEKLY_NEW_TASKS = +localStorage.getItem("klarschiff.weeklylimit") || 10;
const alive = (arr) => arr.filter((x) => !x.deleted);
const playerById = (id) => state.players.find((p) => p.id === id);
const displayName = (id) => (playerById(id)?.name || (id === "p1" ? "Spieler 1" : "Spieler 2"));
const otherOf = (id) => (id === "p1" ? "p2" : "p1");
const bonusFor = (points) => Math.ceil(points / 2);

function weekPoints(playerId) {
  const w = isoWeek();
  return alive(state.completions)
    .filter((c) => c.playerId === playerId && isoWeek(new Date(c.ts)) === w)
    .reduce((s, c) => s + c.points, 0);
}
function balance(playerId) {
  const earned = alive(state.completions).filter((c) => c.playerId === playerId).reduce((s, c) => s + c.points, 0);
  const spent = alive(state.redemptions).filter((r) => r.playerId === playerId).reduce((s, r) => s + r.cost, 0);
  return earned - spent;
}
function streak(playerId) {
  const days = new Set(alive(state.completions).filter((c) => c.playerId === playerId && !c.wheel).map((c) => c.day));
  let n = 0, joker = 1; // 🃏 ein Aussetzer-Tag pro Serie wird verziehen
  const d = new Date();
  if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1); // heute noch offen zählt nicht als Bruch
  for (;;) {
    if (days.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
    else if (n > 0 && joker > 0) { joker--; d.setDate(d.getDate() - 1); }
    else break;
  }
  return n;
}
function maxStreak(playerId) {
  const days = [...new Set(alive(state.completions).filter((c) => c.playerId === playerId && !c.wheel).map((c) => c.day))].sort();
  let best = 0, run = 0, prev = null;
  for (const k of days) {
    const d = new Date(k + "T12:00:00");
    const p = new Date(d); p.setDate(p.getDate() - 1);
    run = prev === dayKey(p) ? run + 1 : 1;
    best = Math.max(best, run);
    prev = k;
  }
  return best;
}

/* ---------- Level, Abzeichen, Tages-Rampenlicht, Glück ---------- */
const LEVEL_TITLES = ["Chaos-Küken", "Krümel-Azubi", "Staub-Scout", "Aufräum-Talent", "Ordnungs-Fee", "Wisch-Wizard", "Klarschiff-Profi", "Ordnungs-Ninja", "Putz-Legende", "Haushalts-Hero", "Glanz-Gottheit", "Klarschiff-Kapitän:in"];
function levelInfo(xp) {
  let lvl = 1, need = 60, base = 0;
  while (xp >= base + need && lvl < 99) { base += need; lvl++; need = Math.round(need * 1.35); }
  return {
    lvl,
    title: LEVEL_TITLES[Math.min(lvl - 1, LEVEL_TITLES.length - 1)],
    pct: Math.min(100, ((xp - base) / need) * 100),
    next: base + need - xp,
  };
}

const BADGES = [
  ["first", "🥇", "Erster Streich", "Erste Aufgabe erledigt"],
  ["ten", "🔟", "Zehnkämpfer:in", "10 Aufgaben erledigt"],
  ["fifty", "🏵️", "Halbes Hundert", "50 Aufgaben erledigt"],
  ["streak3", "🔥", "Warmgelaufen", "3-Tage-Serie geschafft"],
  ["streak7", "🌋", "Eine ganze Woche!", "7-Tage-Serie geschafft"],
  ["bonus5", "🏅", "Rettung in Not", "5× die Aufgabe des Partners übernommen"],
  ["crit1", "💥", "Glückspilz", "Einen kritischen Treffer gelandet"],
  ["week100", "💯", "Powerwoche", "100 Punkte in einer Woche"],
  ["early", "🌅", "Frühputzer:in", "Vor 8 Uhr etwas erledigt"],
  ["night", "🦉", "Nachteule", "Nach 22 Uhr noch etwas erledigt"],
  ["shop", "🛍️", "Gönn dir", "Erste Belohnung eingelöst"],
  ["blitz5", "⚡️", "Blitzmeister:in", "5× einen Blitz-Sprint durchgezogen"],
];
function badgeStats(pid) {
  const mine = alive(state.completions).filter((c) => c.playerId === pid && !c.wheel);
  const weeks = {};
  let early = false, night = false;
  for (const c of mine) {
    const w = isoWeek(new Date(c.ts));
    weeks[w] = (weeks[w] || 0) + c.points;
    const h = new Date(c.ts).getHours();
    if (h < 8) early = true;
    if (h >= 22) night = true;
  }
  return {
    count: mine.length,
    bonuses: mine.filter((c) => c.bonus).length,
    crits: mine.filter((c) => c.crit).length,
    bestWeek: Math.max(0, ...Object.values(weeks)),
    maxStreak: maxStreak(pid),
    early, night,
    blitzes: mine.filter((c) => c.blitz).length,
    redeems: alive(state.redemptions).filter((r) => r.playerId === pid).length,
  };
}
function hasBadge(id, S) {
  switch (id) {
    case "first": return S.count >= 1;
    case "ten": return S.count >= 10;
    case "fifty": return S.count >= 50;
    case "streak3": return S.maxStreak >= 3;
    case "streak7": return S.maxStreak >= 7;
    case "bonus5": return S.bonuses >= 5;
    case "crit1": return S.crits >= 1;
    case "week100": return S.bestWeek >= 100;
    case "early": return S.early;
    case "night": return S.night;
    case "shop": return S.redeems >= 1;
    case "blitz5": return S.blitzes >= 5;
    default: return false;
  }
}

const TESTMODE = () => !!localStorage.getItem("klarschiff.testmode");
function critChance() {
  const luck = localStorage.getItem("klarschiff.luck");
  if (luck !== null) return parseFloat(luck) || 0;
  return TESTMODE() ? 0 : 0.12;
}
const SPOT_BONUS = 5;
function spotlightTaskId() {
  if (TESTMODE()) return null;
  const due = state.tasks
    .filter((t) => !t.archived && t.kind !== "once" && isDueToday(t))
    .sort((a, b) => (a.id < b.id ? -1 : 1));
  if (!due.length) return null;
  let h = 0;
  for (const ch of dayKey()) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return due[h % due.length].id;
}
/* ---------- Samstags-Glücksrad (gewichtete Segmente) ---------- */
// Landewahrscheinlichkeit = Bogenlänge: Niete ~17 %, 💰100 nur 3,3 %
const WHEEL_SEGS = [
  { v: 0, deg: 60, c: "#8B9890", label: "Niete" },
  { v: 5, deg: 62, c: "#0FA38A" },
  { v: 10, deg: 60, c: "#A855F7" },
  { v: 15, deg: 50, c: "#1F6F54" },
  { v: 20, deg: 45, c: "#E9B45C" },
  { v: 25, deg: 40, c: "#0FA38A" },
  { v: 50, deg: 31, c: "#A855F7" },
  { v: 100, deg: 12, c: "#C2410C", label: "💰100" },
];
const isWheelDay = () => todayIdx() === 5 || !!localStorage.getItem("klarschiff.wheelday");
const myWheelSpinToday = () =>
  alive(state.completions).find((c) => c.wheel && c.playerId === device.me && c.day === dayKey());
function daysUntilSaturday() {
  return (5 - todayIdx() + 7) % 7 || 7;
}
function drawWheel(canvas) {
  const size = 560, r = size / 2;
  canvas.width = canvas.height = size;
  const g = canvas.getContext("2d");
  let start = -90;
  for (const s of WHEEL_SEGS) {
    const a0 = (start * Math.PI) / 180, a1 = ((start + s.deg) * Math.PI) / 180;
    g.beginPath(); g.moveTo(r, r); g.arc(r, r, r - 4, a0, a1); g.closePath();
    g.fillStyle = s.c; g.fill();
    g.strokeStyle = "rgba(255,255,255,.85)"; g.lineWidth = 3; g.stroke();
    const mid = (a0 + a1) / 2;
    g.save();
    g.translate(r + Math.cos(mid) * r * 0.6, r + Math.sin(mid) * r * 0.6);
    g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
    if (s.deg < 22) { // schmaler Splitter: Text radial nach außen
      g.rotate(mid);
      g.font = "800 26px ui-rounded, -apple-system, sans-serif";
    } else {
      g.rotate(mid + Math.PI / 2);
      g.font = `800 ${s.v === 0 ? 30 : 38}px ui-rounded, -apple-system, sans-serif`;
    }
    g.fillText(s.label || String(s.v), 0, 0);
    g.restore();
    start += s.deg;
  }
  g.beginPath(); g.arc(r, r, 34, 0, Math.PI * 2);
  g.fillStyle = "#fff"; g.fill();
  g.font = "34px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("🎡", r, r + 2);
}
let wheelSpinning = false;
function spinWheel() {
  if (wheelSpinning || !isWheelDay() || myWheelSpinToday()) return;
  if (!device.me) return openSetup();
  const canvas = $("#wheelCanvas");
  const btn = $("#spinBtn");
  if (!canvas) return;
  wheelSpinning = true;
  if (btn) btn.disabled = true;
  // Segment flächengewichtet auslosen, dann mit Randabstand darin landen
  const roll = Math.random() * 360;
  let cum = 0, seg = WHEEL_SEGS[0], segStart = 0;
  for (const s of WHEEL_SEGS) {
    if (roll < cum + s.deg) { seg = s; segStart = cum; break; }
    cum += s.deg;
  }
  const pad = Math.min(3, seg.deg / 4);
  const angle = segStart + pad + Math.random() * (seg.deg - pad * 2);
  const target = 6 * 360 + (360 - angle);
  canvas.style.transition = "transform 4.2s cubic-bezier(.12,.68,.08,1)";
  canvas.style.transform = `rotate(${target}deg)`;
  canvas.addEventListener("transitionend", () => {
    state.completions.push({
      id: uid(), taskId: null, title: "Glücksrad", points: seg.v, bonus: 0, wheel: 1, wheelAngle: angle,
      playerId: device.me, day: dayKey(), ts: now(), deleted: 0, updatedAt: now(),
    });
    wheelSpinning = false;
    save(); render();
    if (seg.v > 0) {
      confetti(innerWidth / 2, innerHeight / 3, seg.v === 100 ? { glyphs: ["💰", "🎡", "✨", "🤑"], n: 44 } : { glyphs: ["🎡", "✨"], n: 30 });
    }
    toast(seg.v === 100 ? "💰 JACKPOT! 100 Punkte!!!"
      : seg.v === 0 ? "Niete 😅 Nächsten Samstag neue Chance!"
      : `🎡 ${seg.v} P gewonnen – Glückwunsch!`);
  }, { once: true });
}

/* ---------- Starthilfe: Aufgaben-Roulette & Blitz-Sprint ---------- */
const BLITZ_BONUS = 3, BLITZ_DAILY_CAP = 3;
function openTasksToday() {
  return state.tasks.filter((t) => !t.archived && (t.kind === "once" || isDueToday(t)) && !todaysCompletion(t.id));
}
function blitzUsedToday() {
  return alive(state.completions).filter((c) => c.playerId === device.me && c.day === dayKey() && c.blitz).length;
}
const ROOMS = ["Küche", "Bad", "Wohnzimmer", "Schlafzimmer", "Flur", "Draußen"];
const ROOM_EMOJI = { "Küche": "🍳", "Bad": "🛁", "Wohnzimmer": "🛋️", "Schlafzimmer": "🛏️", "Flur": "🚪", "Draußen": "🌳" };
const durLabelOf = (t) => { const [, dur] = diffDurOf(t); return dur === 1 ? "unter 2 Min" : dur === 1.5 ? "2–10 Min" : "länger"; };
const diffEmojiOf = (t) => { const [diff] = diffDurOf(t); return diff === 5 ? "😌" : diff === 15 ? "🤬" : "😤"; };
function taskLastDoneTs(taskId) {
  const cs = alive(state.completions).filter((c) => c.taskId === taskId);
  return cs.length ? cs.reduce((a, b) => (a.ts > b.ts ? a : b)).ts : null;
}
function isOverdue(t) {
  const last = taskLastDoneTs(t.id);
  return last == null || (now() - last) >= 3 * 86400000; // nie erledigt oder 3+ Tage her
}
const ROULETTE_FILTERS = [
  { id: "any", label: "🎲 Zufällig", pick: (c) => c },
  { id: "quick", label: "⚡ Schnell (≤ ~5 Min)", pick: (c) => c.filter((t) => diffDurOf(t)[1] <= 1.5) },
  { id: "hi", label: "💪 Viel Energie", pick: (c) => c.filter((t) => { const [d, u] = diffDurOf(t); return u === 2 || d === 15; }) },
  { id: "lo", label: "😴 Wenig Energie", pick: (c) => c.filter((t) => { const [d, u] = diffDurOf(t); return u === 1 && d <= 10; }) },
  { id: "points", label: "🔥 Viele Punkte", pick: (c) => { if (!c.length) return c; const mx = Math.max(...c.map((t) => t.points)); return c.filter((t) => t.points >= mx * 0.7); } },
  { id: "overdue", label: "⏰ Überfällig", pick: (c) => c.filter(isOverdue) },
];
function roulettePool(filterId) {
  const base = openTasksToday();
  if (filterId.startsWith("room:")) return base.filter((t) => t.room === filterId.slice(5));
  const f = ROULETTE_FILTERS.find((x) => x.id === filterId);
  return f ? f.pick(base) : base;
}

function openRoulette() {
  if (!openTasksToday().length) return toast("Alles erledigt – nichts zu würfeln 🎉");
  if (document.querySelector(".overlay")) return;
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  document.body.appendChild(overlay);

  const showFilters = () => {
    const usedRooms = [...new Set(openTasksToday().map((t) => t.room).filter(Boolean))];
    const roomBtns = usedRooms.map((r) => `<button type="button" class="pt-chip" data-filter="room:${esc(r)}">${ROOM_EMOJI[r] || "🏠"} ${esc(r)}</button>`).join("");
    overlay.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
      <h2>🎲 Was zuerst?</h2>
      <p class="hint">Worauf hast du gerade Lust? Ich such dir was Passendes aus.</p>
      <div class="point-row" id="rouFilters">
        ${ROULETTE_FILTERS.map((f) => `<button type="button" class="pt-chip" data-filter="${f.id}">${f.label}</button>`).join("")}
        ${roomBtns}
      </div>
      <button class="sub-btn" id="rouCancel">Abbrechen</button>
    </div>`;
  };

  const REROLL_MAX = 3;
  const showSpin = (filterId) => {
    const pool = roulettePool(filterId);
    if (!pool.length) {
      overlay.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
        <h2>Nichts gefunden 🤔</h2>
        <p class="hint">Für diese Auswahl ist heute nichts (mehr) offen. Probier einen anderen Filter.</p>
        <button class="primary-btn" id="rouBack">Zurück zur Auswahl</button>
      </div>`;
      return;
    }
    let rerolls = 0, pick = null;
    overlay.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
      <h2>🎯 Deine Mission</h2>
      <div class="rou-title" id="rouTitle">…</div>
      <div id="rouMeta" class="calc" style="text-align:center" hidden></div>
      <div id="rouActions" hidden>
        <button class="primary-btn" id="rouGo" style="margin-bottom:8px">Los geht's! 💪</button>
        <button class="sub-btn" id="rouBlitz">⏱ Blitz-Sprint damit starten</button>
        <button class="sub-btn" id="rouAgain"></button>
      </div>
    </div>`;
    const spin = () => {
      overlay.querySelector("#rouActions").hidden = true;
      overlay.querySelector("#rouMeta").hidden = true;
      let i = 0, delay = 60;
      const step = () => {
        const el = overlay.querySelector("#rouTitle");
        if (!el) return;
        pick = pool[Math.floor(Math.random() * pool.length)];
        el.textContent = pick.title;
        if (++i < 12) { delay = Math.round(delay * 1.18); setTimeout(step, delay); }
        else {
          el.textContent = `${spotlightTaskId() === pick.id ? "✨ " : ""}${pick.title}`;
          const meta = overlay.querySelector("#rouMeta");
          const bonus = pick.assignee && pick.assignee !== device.me ? ` · +${bonusFor(pick.points)} Bonus 🏅` : "";
          meta.innerHTML = `${durLabelOf(pick)} • ${diffEmojiOf(pick)} • <strong>${pick.points} P</strong>${bonus}`;
          meta.hidden = false;
          const again = overlay.querySelector("#rouAgain");
          again.textContent = rerolls < REROLL_MAX ? `🎲 Neu würfeln (noch ${REROLL_MAX - rerolls})` : "Filter wechseln";
          overlay.querySelector("#rouActions").hidden = false;
        }
      };
      step();
    };
    overlay._spin = spin; overlay._reroll = () => { rerolls++; };
    overlay._getPick = () => pick;
    overlay._canReroll = () => rerolls < REROLL_MAX;
    spin();
  };

  overlay.addEventListener("click", (e) => {
    const f = e.target.closest("[data-filter]");
    if (f) return showSpin(f.dataset.filter);
    if (e.target.id === "rouBack") return showFilters();
    if (e.target.id === "rouCancel" || e.target === overlay) return overlay.remove();
    if (e.target.id === "rouAgain") { if (overlay._canReroll()) { overlay._reroll(); overlay._spin(); } else { showFilters(); } return; }
    if (e.target.id === "rouBlitz") { const p = overlay._getPick(); overlay.remove(); return openBlitz(p && p.id); }
    if (e.target.id === "rouGo") { const p = overlay._getPick(); overlay.remove(); return toast(`Los geht's: „${p.title}“ 💪`); }
  });

  showFilters();
}

function runBlitz(overlay, task, totalSecs) {
  const endTs = now() + totalSecs * 1000;
  overlay.querySelector(".sheet").innerHTML = `
    <h2>⏱ Blitz läuft …</h2>
    ${task ? `<p class="hint" style="text-align:center">„${esc(task.title)}“ – einfach anfangen!</p>` : ""}
    <div class="blitz-ring" id="blitzRing"><div class="blitz-inner"><span id="blitzTime"></span></div></div>
    <button class="sub-btn" id="blitzStop">Abbrechen</button>`;
  overlay.querySelector("#blitzStop").addEventListener("click", () => { clearInterval(blitzTimer); overlay.remove(); });
  const tick = () => {
    const ring = overlay.querySelector("#blitzRing"), time = overlay.querySelector("#blitzTime");
    if (!ring) return clearInterval(blitzTimer);
    const leftMs = Math.max(0, endTs - now()); // endTs-basiert: übersteht iOS-Timer-Pausen
    ring.style.background = `conic-gradient(var(--coin) ${100 - (leftMs / (totalSecs * 1000)) * 100}%, var(--card-2) 0)`;
    const s = Math.ceil(leftMs / 1000);
    time.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    if (leftMs <= 0) { clearInterval(blitzTimer); finishBlitz(overlay, task); }
  };
  clearInterval(blitzTimer);
  blitzTimer = setInterval(tick, 400);
  tick();
}
function finishBlitz(overlay, task) {
  confetti(innerWidth / 2, innerHeight / 3, { glyphs: ["⚡️", "✨", "💪"], n: 34 });
  const bonus = blitzUsedToday() < BLITZ_DAILY_CAP ? BLITZ_BONUS : 0;
  const open = task && !task.archived && !todaysCompletion(task.id);
  overlay.querySelector(".sheet").innerHTML = `
    <h2>⚡️ Blitz geschafft!</h2>
    <p class="hint">${open ? "Stark durchgezogen! Direkt abhaken?" : "Stark durchgezogen! Hak ab, was du geschafft hast – jeder Anfang zählt."}</p>
    ${open ? `<button class="primary-btn" id="blitzDone">„${esc(task.title)}“ abhaken${bonus ? ` (+${bonus} P Blitz-Bonus ⚡️)` : ""}</button>` : ""}

/* ---------- Merge (Sync) ---------- */
function mergeById(mine, theirs) {
  const map = new Map(mine.map((x) => [x.id, x]));
  for (const t of theirs) {
    const m = map.get(t.id);
    if (!m || (t.updatedAt || 0) > (m.updatedAt || 0)) map.set(t.id, t);
  }
  return [...map.values()];
}
function mergeState(incoming) {
  if (!incoming || incoming.v !== 1) throw new Error("bad state");
  state.players = state.players.map((p) => {
    const t = (incoming.players || []).find((x) => x.id === p.id);
    return t && (t.updatedAt || 0) > (p.updatedAt || 0) ? t : p;
  });
  for (const key of ["tasks", "completions", "rewards", "redemptions", "skips"]) {
    state[key] = mergeById(state[key] || [], incoming[key] || []);
  }
  // Sync-Raum: beide Geräte einigen sich deterministisch auf den ältesten
  if (incoming.room && (!state.room || incoming.room.createdAt < state.room.createdAt)) {
    state.room = incoming.room;
  }
  // Haustier: Name/Style nach updatedAt (neuer gewinnt), Geburtsdatum = ältestes
  if (incoming.pet) {
    if (!state.pet) state.pet = incoming.pet;
    else {
      const born = Math.min(state.pet.createdAt || now(), incoming.pet.createdAt || now());
      if ((incoming.pet.updatedAt || 0) > (state.pet.updatedAt || 0)) state.pet = { ...incoming.pet };
      state.pet.createdAt = born;
    }
  }
  save();
}

/* ---------- Sync-Kodierung (Link & QR) ---------- */
const b64url = {
  enc: (bytes) => {
    let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  },
  dec: (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0)),
};
async function encodeSync() {
  const bytes = new TextEncoder().encode(JSON.stringify(state));
  if (typeof CompressionStream !== "undefined") {
    const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));
    const gz = new Uint8Array(await new Response(stream).arrayBuffer());
    return "g." + b64url.enc(gz);
  }
  return "r." + b64url.enc(bytes);
}
async function decodeSync(payload) {
  const [kind, data] = [payload.slice(0, 2), payload.slice(2)];
  let bytes = b64url.dec(data);
  if (kind === "g.") {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    bytes = new Uint8Array(await new Response(stream).arrayBuffer());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function buildSyncUrl() {
  return location.origin + location.pathname + location.search + "#sync=" + (await encodeSync());
}

/* ---------- Automatischer Sync über einen gemeinsamen JSON-Raum ----------
   Funktioniert überall dort, wo die Seite externe Server erreichen darf
   (z. B. eigenes Hosting). Auf Hosting mit strikter CSP (z. B. Claude-
   Artifact-Seiten) schlägt fetch fehl – die App erklärt das dann ehrlich. */
const SYNC_CREATE_URL = localStorage.getItem("klarschiff.syncbase") || "https://jsonblob.com/api/jsonBlob";
const SYNC_INTERVAL = +localStorage.getItem("klarschiff.syncinterval") || 12000;
let lastSyncedJson = "", syncTickRunning = false, syncSoonTimer = null;
const syncStatus = { supported: null, lastOkAt: 0 };

async function autoSyncTick() {
  if (!state.room || syncTickRunning) return;
  syncTickRunning = true;
  try {
    const before = JSON.stringify(state);
    const res = await fetch(state.room.url, { cache: "no-store" });
    if (res.ok) {
      try { mergeState(await res.json()); } catch { /* fremder Inhalt – ignorieren */ }
    }
    const json = JSON.stringify(state);
    if (json !== lastSyncedJson) {
      const put = await fetch(state.room.url, {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: json,
      });
      if (put.ok) lastSyncedJson = json;
    }
    syncStatus.supported = true;
    syncStatus.lastOkAt = now();
    if (json !== before) {
      const a = document.activeElement;
      const typing = a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA") && a.value;
      if (!typing && !wheelSpinning && !document.querySelector(".overlay")) render();
      notifyPartnerNews();
    } else if (tab === "profile") {
      const el = $("#autoSyncStatus");
      if (el) el.textContent = autoSyncStatusText();
    }
  } catch {
    if (syncStatus.supported === null) syncStatus.supported = false;
  } finally {
    syncTickRunning = false;
  }
}
function syncSoon() {
  if (!state.room) return;
  clearTimeout(syncSoonTimer);
  syncSoonTimer = setTimeout(autoSyncTick, 1500);
}
async function enableAutoSync() {
  try {
    const res = await fetch(SYNC_CREATE_URL, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state),
    });
    if (!res.ok) throw new Error("create failed");
    const loc = res.headers.get("Location");
    if (!loc) throw new Error("no location");
    state.room = { url: new URL(loc, SYNC_CREATE_URL).href, createdAt: now() };
    syncStatus.supported = true;
    save();
    autoSyncTick();
    render();
    toast("Automatischer Sync ist an ✨ Einmal QR/Code teilen – dann läuft's von allein");
  } catch {
    syncStatus.supported = false;
    render();
    toast("Klappt auf dieser Seite leider nicht – Details stehen im Profil");
  }
}

function autoSyncStatusText() {
  if (!syncStatus.lastOkAt) return "Verbinde …";
  const s = Math.max(0, Math.round((now() - syncStatus.lastOkAt) / 1000));
  if (s > 90) return "Gerade nicht erreichbar – lokal ist alles gespeichert, es wird weiter versucht.";
  return `Aktiv – zuletzt abgeglichen vor ${s} s.`;
}

/* ---------- QR-Code (Byte-Modus, EC-Level L, Version 1–25) ---------- */
const QR = (() => {

  const RS = [
    [[1,26,19]], [[1,44,34]], [[1,70,55]], [[1,100,80]], [[1,134,108]],
    [[2,86,68]], [[2,98,78]], [[2,121,97]], [[2,146,116]],
    [[2,86,68],[2,87,69]], [[4,101,81]], [[2,116,92],[2,117,93]], [[4,133,107]],
    [[3,145,115],[1,146,116]], [[5,109,87],[1,110,88]], [[5,122,98],[1,123,99]],
    [[1,135,107],[5,136,108]], [[5,150,120],[1,151,121]], [[3,141,113],[4,142,114]],
    [[3,135,107],[5,136,108]], [[4,144,116],[4,145,117]], [[2,139,111],[7,140,112]],
    [[4,151,121],[5,152,122]], [[6,147,117],[4,148,118]], [[8,132,106],[4,133,107]],
  ];
  const ALIGN = [
    [], [6,18], [6,22], [6,26], [6,30], [6,34],
    [6,22,38], [6,24,42], [6,26,46], [6,28,50], [6,30,54], [6,32,58], [6,34,62],
    [6,26,46,66], [6,26,48,70], [6,26,50,74], [6,30,54,78], [6,30,56,82], [6,30,58,86],
    [6,34,62,90], [6,28,50,72,94], [6,26,50,74,98], [6,30,54,78,102], [6,28,54,80,106], [6,32,58,84,110],
  ];

  const bitLen = (n) => { let l = 0; while (n) { l++; n >>>= 1; } return l; };
  function bch(data, poly, shift) {
    let d = data << shift;
    while (bitLen(d) >= bitLen(poly)) d ^= poly << (bitLen(d) - bitLen(poly));
    return (data << shift) | d;
  }
  function rsDivisor(degree) {
    const res = new Array(degree).fill(0); res[degree - 1] = 1;
    let root = 1;
    for (let i = 0; i < degree; i++) {
      for (let j = 0; j < degree; j++) {
        res[j] = gmul(res[j], root);
        if (j + 1 < degree) res[j] ^= res[j + 1];
      }

  }
  function rsRemainder(data, divisor) {
    const res = new Array(divisor.length).fill(0);
    for (const b of data) {
      const f = b ^ res.shift();
      res.push(0);
      divisor.forEach((c, i) => { res[i] ^= gmul(c, f); });

  }

  function encode(text) {
    const bytes = new TextEncoder().encode(text);
    let version = 0, dataCap = 0;
    for (let v = 1; v <= 25; v++) {
      const cap = RS[v - 1].reduce((s, [n, , d]) => s + n * d, 0);
      if (4 + (v < 10 ? 8 : 16) + bytes.length * 8 <= cap * 8) { version = v; dataCap = cap; break; }
    }
    if (!version) return null; // zu groß für Version 25

    const buf = []; let acc = 0, accLen = 0, bitCount = 0;
    const put = (val, len) => {
      for (let i = len - 1; i >= 0; i--) {
        acc = (acc << 1) | ((val >>> i) & 1);
        bitCount++;
        if (++accLen === 8) { buf.push(acc); acc = 0; accLen = 0; }
      }
    };
    put(0b0100, 4);
    put(bytes.length, version < 10 ? 8 : 16);
    for (const b of bytes) put(b, 8);
    put(0, Math.min(4, dataCap * 8 - bitCount));      // Terminator
    if (accLen > 0) put(0, 8 - accLen);               // auf Byte auffüllen
    for (let alt = 0; buf.length < dataCap; alt ^= 1) buf.push(alt ? 0x11 : 0xEC);

    // In Blöcke teilen, Fehlerkorrektur rechnen, verschachteln
    const blocks = [];
    let offset = 0;
    for (const [count, total, dataLen] of RS[version - 1]) {
      for (let i = 0; i < count; i++) {
        const data = buf.slice(offset, offset + dataLen);
        offset += dataLen;
        blocks.push({ data, ec: rsRemainder(data, rsDivisor(total - dataLen)) });
      }
    }
    const out = [];
    const maxData = Math.max(...blocks.map((b) => b.data.length));
    for (let i = 0; i < maxData; i++) for (const b of blocks) if (i < b.data.length) out.push(b.data[i]);
    const maxEc = Math.max(...blocks.map((b) => b.ec.length));
    for (let i = 0; i < maxEc; i++) for (const b of blocks) if (i < b.ec.length) out.push(b.ec[i]);

    // Matrix aufbauen
    const size = 17 + 4 * version;
    const M = Array.from({ length: size }, () => new Array(size).fill(null));
    const finder = (row, col) => {
      for (let r = -1; r <= 7; r++) for (let c = -1; c <= 7; c++) {
        const y = row + r, x = col + c;
        if (y < 0 || y >= size || x < 0 || x >= size) continue;
        const dark = (r >= 0 && r <= 6 && (c === 0 || c === 6)) ||
                     (c >= 0 && c <= 6 && (r === 0 || r === 6)) ||
                     (r >= 2 && r <= 4 && c >= 2 && c <= 4);
        M[y][x] = dark ? 1 : 0;
      }
    };
    finder(0, 0); finder(size - 7, 0); finder(0, size - 7);
    // Alignment VOR Timing: ab Version 7 liegen Muster auf den Timing-Linien
    // und dürfen nur bei Überlappung mit einem Finder entfallen
    const pos = ALIGN[version - 1];
    for (const r of pos) for (const c of pos) {
      if (M[r][c] !== null) continue;
      for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++)
        M[r + dr][c + dc] = Math.max(Math.abs(dr), Math.abs(dc)) !== 1 ? 1 : 0;
    }
    for (let i = 8; i < size - 8; i++) {
      if (M[i][6] === null) M[i][6] = i % 2 === 0 ? 1 : 0;
      if (M[6][i] === null) M[6][i] = i % 2 === 0 ? 1 : 0;
    }
    // Formatinfo: EC-Level L (01), Maske 0
    const fmt = bch((0b01 << 3) | 0, 0b10100110111, 10) ^ 0b101010000010010;
    for (let i = 0; i < 15; i++) {
      const m = (fmt >> i) & 1;
      if (i < 6) M[i][8] = m; else if (i < 8) M[i + 1][8] = m; else M[size - 15 + i][8] = m;
      if (i < 8) M[8][size - 1 - i] = m; else if (i < 9) M[8][15 - i] = m; else M[8][15 - i - 1] = m;
    }
    M[size - 8][8] = 1;
    if (version >= 7) {
      const vi = bch(version, 0b1111100100101, 12);
      for (let i = 0; i < 18; i++) {
        const m = (vi >> i) & 1;
        M[Math.floor(i / 3)][(i % 3) + size - 11] = m;
        M[(i % 3) + size - 11][Math.floor(i / 3)] = m;
      }
    }
    // Datenbits im Zickzack platzieren, Maske 0: (Zeile+Spalte) gerade
    let inc = -1, row = size - 1, bitIndex = 7, byteIndex = 0;
    for (let col = size - 1; col > 0; col -= 2) {
      if (col === 6) col--;
      for (;;) {
        for (let c = 0; c < 2; c++) {
          if (M[row][col - c] === null) {
            let dark = byteIndex < out.length && ((out[byteIndex] >>> bitIndex) & 1) === 1;
            if ((row + (col - c)) % 2 === 0) dark = !dark;
            M[row][col - c] = dark ? 1 : 0;
            if (--bitIndex === -1) { byteIndex++; bitIndex = 7; }
          }
        }
        row += inc;
        if (row < 0 || size <= row) { row -= inc; inc = -inc; break; }
      }
    }
    return { size, modules: M };
  }

})();

function drawQR(canvas, text) {
  const code = QR.encode(text);
  if (!code) return false;
  const quiet = 4, total = code.size + quiet * 2;
  const scale = Math.max(2, Math.floor(600 / total));
  canvas.width = canvas.height = total * scale;
  const g = canvas.getContext("2d");
  g.fillStyle = "#FFFFFF";
  g.fillRect(0, 0, canvas.width, canvas.height);
  g.fillStyle = "#111111";
  for (let y = 0; y < code.size; y++) for (let x = 0; x < code.size; x++)
    if (code.modules[y][x]) g.fillRect((x + quiet) * scale, (y + quiet) * scale, scale, scale);
  return true;
}

const cCanvas = $("#confetti"), ctx = cCanvas.getContext("2d");
let particles = [], confettiRaf = null;
function sizeCanvas() {
  cCanvas.width = innerWidth * devicePixelRatio;
  cCanvas.height = innerHeight * devicePixelRatio;
}
addEventListener("resize", sizeCanvas); sizeCanvas();
function confetti(x, y, opts = {}) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#0FA38A", "#A855F7", "#E9B45C", "#1F6F54", "#F0876F"];
  const glyphs = opts.glyphs || null; // z. B. ["🧦","🧹","✨"]
  const n = opts.n || 26;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 5;
    particles.push({
      x: x * devicePixelRatio, y: y * devicePixelRatio,
      vx: Math.cos(a) * v * devicePixelRatio, vy: (Math.sin(a) * v - 4) * devicePixelRatio,
      s: (3 + Math.random() * 4) * devicePixelRatio, r: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.3, c: colors[i % colors.length],
      g: glyphs ? glyphs[i % glyphs.length] : null, life: 60 + Math.random() * 30,
    });
  }
  if (!confettiRaf) tickConfetti();
}
function tickConfetti() {
  ctx.clearRect(0, 0, cCanvas.width, cCanvas.height);
  particles = particles.filter((p) => p.life > 0);
  for (const p of particles) {
    p.life--; p.x += p.vx; p.y += p.vy; p.vy += 0.25 * devicePixelRatio; p.r += p.vr;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.globalAlpha = Math.min(1, p.life / 30);
    if (p.g) {
      ctx.font = `${p.s * 3}px sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(p.g, 0, 0);
    } else {
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
    }
    ctx.restore();
  }
  confettiRaf = particles.length ? requestAnimationFrame(tickConfetti) : null;
  if (!confettiRaf) ctx.clearRect(0, 0, cCanvas.width, cCanvas.height);
}

function petSpeak(stageEl) {
  const av = stageEl.querySelector(".pet-avatar");
  if (av) { av.classList.remove("hop"); void av.offsetWidth; av.classList.add("hop"); }
  const phrases = PET_PHRASES[petMood()] || PET_PHRASES.content;
  const txt = phrases[Math.floor(Math.random() * phrases.length)];
  let b = stageEl.querySelector(".pet-bubble");
  if (!b) { b = document.createElement("div"); b.className = "pet-bubble"; stageEl.appendChild(b); }
  b.textContent = txt;
  b.classList.remove("show"); void b.offsetWidth; b.classList.add("show");
  clearTimeout(petBubbleT);
  petBubbleT = setTimeout(() => b.classList.remove("show"), 2600);
}

function openPet() {
  if (document.querySelector(".overlay")) return;
  const s = petStage(), pet = state.pet || {};
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true">
      <h2>Euer Haustier 🐣</h2>
      <div class="pet-card" style="background:var(--card-2)">
        <div class="pet-stage"><div class="pet-avatar mood-${petMood()}">${petStyleEmoji() ? `<span class="pet-hat">${petStyleEmoji()}</span>` : ""}<span class="pet-emoji">${s.emoji}</span></div></div>
        <div class="pet-info">
          <div class="pet-name">${esc(pet.name || "Fussel")} <span class="pet-stagelabel">· ${s.name}</span></div>
          <div class="pet-next">Zusammen erledigt: ${s.count} Aufgaben</div>
          ${s.next ? `<div class="rp"><div class="rp-fill" style="width:${s.pct}%"></div></div><div class="pet-next">Noch ${s.toNext} bis „${s.next.name}“</div>` : `<div class="pet-next">Legendär! 🌟</div>`}
        </div>
      </div>
      <span class="form-label">Name</span>
      <input id="petName" maxlength="16" value="${esc(pet.name || "")}" placeholder="z. B. Fussel" autocomplete="off">
      <span class="form-label">Stil (durch Aufräumen freischalten)</span>
      <div class="pet-styles" id="petStyles">
        ${PET_STYLES.map((st) => {
          const unlocked = st.need();
          const active = (pet.style || "none") === st.id;
          return `<button type="button" class="pet-style ${unlocked ? "" : "locked"}" data-style="${st.id}" aria-pressed="${active}">${st.emoji ? st.emoji + " " : ""}${st.name}${!unlocked && st.hint ? ` <span class="lock-hint">🔒 ${st.hint}</span>` : ""}</button>`;
        }).join("")}
      </div>
      <p class="hint">Euer Haustier wächst mit jeder erledigten Aufgabe und reagiert auf eure Aktivität. Es wird nie traurig – nur mal gelangweilt 😴. Tipp es auf der Startseite an!</p>
      <button class="primary-btn" id="petClose">Fertig</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e) => {
    const st = e.target.closest(".pet-style");
    if (st) {
      const def = PET_STYLES.find((x) => x.id === st.dataset.style);
      if (!def.need()) return toast(`Erst freischalten: ${def.hint} 🔒`);
      state.pet.style = def.id; state.pet.updatedAt = now();
      overlay.querySelectorAll(".pet-style").forEach((b) => b.setAttribute("aria-pressed", String(b === st)));
      overlay.querySelector(".pet-card .pet-avatar").innerHTML =
        (def.emoji ? `<span class="pet-hat">${def.emoji}</span>` : "") + `<span class="pet-emoji">${petStage().emoji}</span>`;
      save();
      return;
    }
    if (e.target.id === "petClose" || e.target === overlay) {
      const nm = overlay.querySelector("#petName").value.trim();
      if (nm && nm !== state.pet.name) { state.pet.name = nm; state.pet.updatedAt = now(); save(); }
      overlay.remove(); render();
    }
  });
}

function viewDuel() {

    const days = [];
    for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d); }
    const data = days.map((d) => ({
      lab: d.toLocaleDateString("de-DE", { weekday: "short" }),
      full: d.toLocaleDateString("de-DE", { day: "numeric", month: "numeric" }),
      p1: pointsOnDay("p1", dayKey(d)), p2: pointsOnDay("p2", dayKey(d)),
    }));
    const max = Math.max(1, ...data.flatMap((x) => [x.p1, x.p2]));
    chart = `
      <div class="duel-legend"><span><span class="pdot p1"></span>${esc(displayName("p1"))}</span><span><span class="pdot p2"></span>${esc(displayName("p2"))}</span></div>

            <div class="col-track"><div class="col-fill p1" data-h="${x.p1 ? Math.max(6, (x.p1 / max) * 100) : 0}"></div></div>
            <div class="col-track"><div class="col-fill p2" data-h="${x.p2 ? Math.max(6, (x.p2 / max) * 100) : 0}"></div></div>

    const row = (pid, v) => `
      <div class="bar-row">
        <span class="bar-name"><span class="pdot ${pid}"></span>${esc(displayName(pid))}</span>

        <span class="bar-val" data-count="${v}">0 P</span>

    chart = `<div class="form-card">${row("p1", v1)}${row("p2", v2)}</div>`;

  const doneTotal = alive(state.completions).filter((c) => !c.wheel).length;
  const doneWeek = alive(state.completions).filter((c) => !c.wheel && isoWeek(new Date(c.ts)) === isoWeek()).length;
  const s1 = streak("p1"), s2 = streak("p2");
  const streakLead = s1 === s2
    ? (s1 > 0 ? `je ${s1} 🔥` : "–")
    : `${esc(displayName(s1 > s2 ? "p1" : "p2"))}: ${Math.max(s1, s2)} 🔥`;
  return `
    <div class="duel-head">
      <div class="duel-player"><span class="avatar p1">${esc(initial("p1"))}</span>${esc(displayName("p1"))}</div>
      <span class="vs">VS</span>
      <div class="duel-player">${esc(displayName("p2"))}<span class="avatar p2">${esc(initial("p2"))}</span></div>
    </div>
    <div class="form-card">
      ${["p1", "p2"].map((pid) => {
        const li = levelInfo(earnedTotal(pid));
        return `
        <div class="lvl-row">
          <span class="lvl-name"><span class="pdot ${pid}"></span>${esc(displayName(pid))}</span>
          <span class="lvl-title">Lv. ${li.lvl} „${li.title}“ · noch ${li.next} P</span>
        </div>
        <div class="lvl-track"><div class="lvl-fill ${pid}" data-w="${li.pct}" style="width:0%"></div></div>`;
      }).join("")}
    </div>
    <div class="point-row" id="duelMetric">${metricChips}</div>
    ${chart}
    <div class="stat-tiles">
      <div class="stat-tile"><span class="st-label">Erledigt diese Woche</span><span class="st-val">${doneWeek}×</span></div>
      <div class="stat-tile"><span class="st-label">Erledigt insgesamt</span><span class="st-val">${doneTotal}×</span></div>
      <div class="stat-tile"><span class="st-label">Beste Serie</span><span class="st-val">${streakLead}</span></div>
      <div class="stat-tile"><span class="st-label">Belohnungen eingelöst</span><span class="st-val">${alive(state.redemptions).length}×</span></div>
    </div>
    <div class="section-head"><h2>🎡 Samstags-Glücksrad</h2></div>
    <div class="form-card">
      ${(() => {
        const spun = myWheelSpinToday();
        if (!isWheelDay()) {
          const d = daysUntilSaturday();
          return `
            <p class="hint">Jeden Samstag darf jede:r <strong>einmal</strong> am Rad drehen – von Niete bis 💰 100-Punkte-Jackpot. Noch ${d === 1 ? "1 Tag" : d + " Tage"} bis zum nächsten Dreh!</p>
            <div class="wheel-wrap idle"><div class="wheel-pointer"></div><canvas id="wheelCanvas" aria-label="Glücksrad, erst am Samstag drehbar"></canvas></div>`;
        }
        if (spun) {
          return `

    </div>`;

function viewHistory() {
  const items = [
    ...alive(state.completions).map((c) => ({
      ts: c.ts, ico: c.wheel ? "🎡" : c.crit ? "💥" : c.blitz ? "⚡️" : c.bonus ? "🏅" : "✅", pts: `+${c.points}`, neg: false,
      text: c.wheel
        ? `<strong>${esc(displayName(c.playerId))}</strong> hat am Glücksrad ${c.points > 0 ? "gewonnen" : "eine Niete gedreht 😬"}${c.points >= 100 ? " – JACKPOT! 💰" : ""}`
        : `<strong>${esc(displayName(c.playerId))}</strong> hat „${esc(c.title)}“ erledigt${c.crit ? " – kritischer Treffer!" : c.bonus ? " – mit Bonus" : ""}${c.spot ? " ✨" : ""}`,
    })),
    ...alive(state.redemptions).map((r) => ({
      ts: r.ts, ico: "🎁", pts: `−${r.cost}`, neg: true,
      text: `<strong>${esc(displayName(r.playerId))}</strong> hat „${esc(r.title)}“ eingelöst`,
    })),
  ].sort((a, b) => b.ts - a.ts).slice(0, 100);
  const dayLabel = (ts) => {
    const k = dayKey(new Date(ts));
    if (k === dayKey()) return "Heute";
    const y = new Date(); y.setDate(y.getDate() - 1);
    if (k === dayKey(y)) return "Gestern";
    const d = new Date(ts);
    return `${d.getDate()}.${d.getMonth() + 1}.`;
  };
  let lastDay = null;
  const rows = items.map((i) => {
    const k = dayKey(new Date(i.ts));
    const head = k !== lastDay ? `<li class="feed-day">${dayLabel(i.ts)}</li>` : "";
    lastDay = k;
    return `${head}<li><span class="f-ico">${i.ico}</span><span class="f-text">${i.text} <span class="f-pts ${i.neg ? "neg" : ""}">${i.pts} P</span></span><span class="f-time">${fmtTime(i.ts)}</span></li>`;
  }).join("");
  return `
    <div class="section-head"><h2>Verlauf</h2></div>
    ${items.length === 0 ? `<div class="empty">Hier erscheint alles, was ihr erledigt und einlöst.</div>` : `<ul class="feed">${rows}</ul>`}
    <p class="hint">Alles bleibt dauerhaft gespeichert und wandert mit jedem Sync komplett mit – ihr seht beide immer die ganze Geschichte.</p>`;
}
